{% extends "base.html" %}
{% block title %}Sign Up — BazaarLink{% endblock %}
{% block content %}
<div class="container-main" style="max-width: 480px; padding: 48px 20px;">
  <div class="card-box">
    <h2>Create Account</h2>
    <form method="post" action="{{ url_for('signup') }}">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input id="full_name" name="full_name" type="text" required class="form-control" />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required class="form-control" />
      </div>
      <div class="form-group">
        <label for="account_type">Account Type</label>
        <select id="account_type" name="account_type" class="form-control">
          <option value="buyer">Buyer</option>
          <option value="seller">Seller</option>
          <option value="affiliate">Affiliate Member</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required class="form-control" />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" required class="form-control" />
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
