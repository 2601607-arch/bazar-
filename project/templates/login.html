{% extends "base.html" %}
{% block title %}Login — BazaarLink{% endblock %}
{% block content %}
<div class="container-main" style="max-width: 460px; padding: 48px 20px;">
  <div class="card-box">
    <h2>Sign In to BazaarLink</h2>
    <p style="font-size: 0.875rem; color: var(--ink-muted); margin-bottom: 20px;">
      Demo login routes directly to your chosen role dashboard.
    </p>
    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="role">Demo Dashboard Role</label>
        <select id="role" name="role" class="form-control">
          <option value="buyer">Buyer</option>
          <option value="seller">Seller</option>
          <option value="affiliate">Affiliate Member</option>
        </select>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required value="amina.buyer@bazaarlink.demo" class="form-control" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required value="demo1234" class="form-control" />
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; margin-bottom: 16px;">
        <label><input type="checkbox" checked /> Remember Me</label>
        <a href="#" onclick="showToast('Demo password reset simulated'); return false;" style="color: var(--brand-orange);">Forgot Password?</a>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
