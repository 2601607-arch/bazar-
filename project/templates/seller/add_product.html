{% extends "base.html" %}
{% block title %}Add Product — BazaarLink{% endblock %}
{% block content %}
<div class="container-main dashboard-shell">
  <div class="dashboard-top"><h2>Add New Product</h2></div>
  <div class="dashboard-grid">
    <aside class="dashboard-sidebar">
      <nav class="sidebar-nav">
        <a href="{{ url_for('seller_dashboard') }}">Seller Dashboard</a>
        <a href="{{ url_for('seller_add_product') }}" class="active">Add Product</a>
        <a href="{{ url_for('seller_products') }}">Manage Products</a>
        <a href="{{ url_for('seller_orders') }}">Seller Orders</a>
        <a href="{{ url_for('seller_profile') }}">Seller Profile</a>
      </nav>
    </aside>
    <div class="card-box">
      {% if added %}
      <div style="padding: 12px; background: #ecfdf5; color: #15803d; border-radius: 8px; margin-bottom: 16px;">
        Demo product submitted!
      </div>
      {% endif %}
      <form method="post" action="{{ url_for('seller_add_product') }}">
        <div class="form-group"><label>Product Name</label><input type="text" required class="form-control" /></div>
        <div class="form-group"><label>Product Price (Rs.)</label><input type="number" required value="5000" class="form-control" /></div>
        <div class="form-group"><label>Stock Quantity</label><input type="number" required value="25" class="form-control" /></div>
        <div class="form-group"><label>Product Image Path</label><input type="text" value="images/products/wireless-headphones.jpg" class="form-control" /></div>
        <div class="form-group"><label>Product Description</label><textarea rows="4" required class="form-control"></textarea></div>
        <button type="submit" class="btn-primary">Publish Product</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
