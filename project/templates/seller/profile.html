{% extends "base.html" %}
{% block title %}Seller Profile — BazaarLink{% endblock %}
{% block content %}
<div class="container-main dashboard-shell">
  <div class="dashboard-top"><h2>Seller Profile</h2></div>
  <div class="dashboard-grid">
    <aside class="dashboard-sidebar">
      <nav class="sidebar-nav">
        <a href="{{ url_for('seller_dashboard') }}">Seller Dashboard</a>
        <a href="{{ url_for('seller_add_product') }}">Add Product</a>
        <a href="{{ url_for('seller_products') }}">Manage Products</a>
        <a href="{{ url_for('seller_orders') }}">Seller Orders</a>
        <a href="{{ url_for('seller_profile') }}" class="active">Seller Profile</a>
      </nav>
    </aside>
    <div class="card-box">
      <div class="form-group"><label>Store Name</label><input type="text" value="SoundCraft Official" class="form-control" /></div>
      <div class="form-group"><label>Dispatch City</label><input type="text" value="Lahore" class="form-control" /></div>
      <button type="button" onclick="showToast('Seller profile updated')" class="btn-primary">Save Profile</button>
    </div>
  </div>
</div>
{% endblock %}
